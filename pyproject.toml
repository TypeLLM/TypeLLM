[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "typellm"
version = "0.6.9"
description = "Type-Safe Decoding for Autoregressive LLMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "transformers>=5.0",
]

[project.urls]
Homepage = "https://typellm.ai/"
Repository = "https://github.com/TypeLLM/TypeLLM"

[project.scripts]
typellm = "typellm.cli:main"

[tool.setuptools]
packages = ["typellm"]
